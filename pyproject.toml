[project]
name = "team-neki-workflow"
version = "0.1.0"
description = "Team Neki Prefect 워크플로"
requires-python = ">=3.13"
dependencies = [
    "prefect>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deployments", "flows", "tasks"]
