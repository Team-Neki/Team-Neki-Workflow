# PR 마다 임포트와 deployment 수집을 확인하고 이미지가 빌드되는지 본다.
# 푸시는 하지 않는다. 푸시와 GitOps 갱신은 main merge 시 build.yml 이 한다.
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          # 운영 이미지(Dockerfile 베이스)와 같은 Python. 비우면 uv 가 최신(3.15)을 받는데
          # psycopg-binary 휠이 아직 없어 uv sync 가 실패한다.
          python-version: "3.13"
      - run: uv sync --frozen
      - run: make check
      - run: make image
